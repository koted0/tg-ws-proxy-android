[package]
name = "tgwsproxy"
version = "1.5.0"
edition = "2021"

[workspace]
members = ["crates/fastpath"]

[lib]
name = "tgwsproxy"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
once_cell = "1"
parking_lot = "0.12"
# AES-256-CTR и маска WS — в отдельном крейте с opt-level 3 (горячий путь).
tgws-fastpath = { path = "crates/fastpath" }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
byteorder = "1"
socket2 = { version = "0.5", features = ["all"] }
# HTTP/2-транспорт медиа через Cloudflare (src/cf_h2.rs).
h2 = "0.4"
http = "1"
bytes = "1"

# Корни Mozilla для проверки сертификатов GitHub/DoH (см. src/https.rs).
webpki-roots = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[profile.release]
# Размер — для всего, кроме горячего пути данных (см. ниже).
opt-level = "z"
lto = true
codegen-units = 1
# unwind: паника в соединении гасится рантаймом tokio, а не роняет приложение
panic = "unwind"
strip = true

# Горячий путь: AES-CTR на каждый байт трафика (4 прохода на байт в мосте).
# С opt-level "z" шифрование было в ~7-10 раз медленнее (бенчмарк
# crypto::bench), поэтому он вынесен в tgws-fastpath и собирается на "3",
# а остальное ядро — под размер.
[profile.release.package.tgws-fastpath]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[profile.release.package.ctr]
opt-level = 3

[profile.release.package.cipher]
opt-level = 3
